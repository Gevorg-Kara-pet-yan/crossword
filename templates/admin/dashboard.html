<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Ադմին պանել</title>
    <style>
        body { font-family: Segoe UI, sans-serif; background: #f4f6f8; }
        h1 { text-align: center; margin-top: 20px; }
        table { width: 90%; margin: 30px auto; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background: #1976d2; color: #fff; }
        a, button { text-decoration: none; color: #1976d2; border: none; background: none; cursor: pointer; }
        .center-button { display: block; margin: 20px auto; padding: 10px 20px; background: #1976d2; color: #fff; border-radius: 5px; }
        .danger { color: red; }
        .action-block { display: inline-block; }
        .confirm-box {
            background: #fff4f4;
            border: 1px solid #f44336;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 5px;
        }
        hr { border: none; border-top: 1px solid #ccc; margin: 5px 0; }
    </style>
</head>
<body>

<h1>Կառավարման վահանակ</h1>

<table>
    <tr>
        <th>ID</th>
        <th>Վերնագիր</th>
        <th>Ստեղծող</th>
        <th>Մասնակիցներ</th>
        <th>Գործողություններ</th>
    </tr>

    {% for c in crosswords %}
    <tr>
        <td>{{ c.id }}</td>
        <td>{{ c.title }}</td>
        <td>{{ c.creator_name or "-" }}</td>
        <td>{{ c.participants }}</td>
        <td>
            <!-- Ջնջել կոճակ inline հաստատմամբ -->
            <div class="action-block">
                <button class="danger" onclick="showConfirm({{ c.id }})">Ջնջել</button>

                <div id="confirm-{{ c.id }}" class="confirm-box" style="display:none;">
                    <span>Վստա՞հ եք, որ ցանկանում եք ջնջել։</span><br>
                    <form method="post" action="{{ url_for('admin_delete_crossword', id=c.id) }}" style="display:inline;">
                        <button type="submit" class="danger">Հաստատել</button>
                    </form>
                    <button type="button" onclick="hideConfirm({{ c.id }})">Չեղարկել</button>
                </div>
            </div>

            <hr>

            <!-- Արդյունքներ -->
            <div class="action-block">
                <a href="{{ url_for('admin_crossword_results', id=c.id) }}">Արդյունքներ</a>
            </div>
        </td>
    </tr>
    {% endfor %}
</table>

<a href="{{ url_for('admin_logout') }}"
   style="display: block; width: 150px; margin: 30px auto;
          text-align: center; padding: 10px;
          background-color: #d32f2f; color: white;
          text-decoration: none; border-radius: 5px;">
    Դուրս գալ
</a>
<script>
function showConfirm(id) {
    document.getElementById('confirm-' + id).style.display = 'inline-block';
}
function hideConfirm(id) {
    document.getElementById('confirm-' + id).style.display = 'none';
}
</script>

</body>
</html>
