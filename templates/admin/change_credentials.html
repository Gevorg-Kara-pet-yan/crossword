<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Փոխել անունը և գաղտնաբառը</title>
    <style>
        body { font-family: Segoe UI; background:#f4f6f8; padding:40px; }
        .box { max-width:400px; margin:auto; background:#fff; padding:20px; border-radius:8px; }
        input, button { width:100%; padding:10px; margin:8px 0; box-sizing:border-box; }
        button { background:#1976d2; color:#fff; border:none; cursor:pointer; border-radius:4px; }
        button:hover { background:#1565c0; }
        .msg-error { color:red; background:#fdecea; padding:10px; border-radius:4px; margin-bottom:10px; }
        .msg-success { color:green; background:#e8f5e9; padding:10px; border-radius:4px; margin-bottom:10px; }
    </style>
</head>
<body>
<div class="box">
    <h3>Փոխել անունը և գաղտնաբառը</h3>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="{{ 'msg-error' if '❌' in msg else 'msg-success' }}">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('admin_change_credentials') }}">
        <label>Նոր անուն</label>
        <input type="text" name="username" value="{{ admin.username }}" required>

        <label>Հին գաղտնաբառ</label>
        <input type="password" name="old_password" required>

        <label>Նոր գաղտնաբառ</label>
        <input type="password" name="new_password" required>

        <button type="submit">Պահպանել</button>
    </form>

    <br>
    <a href="{{ url_for('admin_dashboard') }}">⬅ Վերադառնալ</a>
</div>
</body>
</html>
