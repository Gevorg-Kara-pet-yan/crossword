<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Ադմին մուտք</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            background: #f4f6f8;
        }
        .login-box {
            width: 320px;
            margin: 120px auto;
            padding: 25px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
        }
        button {
            background: #1976d2;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #125aa0;
        }
        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Ադմին մուտք</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post">
        <input type="text" name="username" placeholder="Օգտանուն" required>
        <input type="password" name="password" placeholder="Գաղտնաբառ" required>
        <button type="submit">Մուտք</button>
    </form>
</div>
</body>
</html>
