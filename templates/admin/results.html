<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Մասնակիցների արդյունքներ</title>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            background: #f4f6f8;
        }
        h1 {
            text-align: center;
        }
        table {
            width: 95%;
            margin: 30px auto;
            border-collapse: collapse;
            background: #fff;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #388e3c;
            color: #fff;
        }
        .ok {
            color: green;
            font-weight: bold;
        }
        .no {
            color: red;
            font-weight: bold;
        }
        a {
            display: block;
            width: 400px;
            margin: 20px auto;
            text-align: center;
            text-decoration: none;
            background: #1976d2;
            color: #fff;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1>Մասնակիցների արդյունքներ</h1>

<table>
    <tr>
        <th>Անուն</th>
        <th>Ազգանուն</th>
        <th>Դպրոց</th>
        <th>Դասարան</th>
        <th>Ժամանակ (վրկ)</th>
        <th>Կարգավիճակ</th>
    </tr>

    {% for r in rows %}
    <tr>
        <td>{{ r.name }}</td>
        <td>{{ r.surname }}</td>
        <td>{{ r.school }}</td>
        <td>{{ r.grade }}</td>
        <td>{{ r.duration }}</td>
        <td>
            {% if r.is_completed %}
                <span class="ok">✔ Լուծված</span>
            {% else %}
                <span class="no">✘ Չլուծված</span>
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>

<a href="{{ url_for('admin_logout') }}"
   style="display: block; width: 150px; margin: 30px auto;
          text-align: center; padding: 10px;
          background-color: #d32f2f; color: white;
          text-decoration: none; border-radius: 5px;">
    Դուրս գալ
</a>


</body>
</html>
